# Configuracao usada apenas pelos testes. Substitui a de src/main/resources.
#
# O motivo de existir: o @SpringBootTest executa os CommandLineRunner do contexto, e o
# console da FASE 4 fica bloqueado lendo System.in - a suite inteira travava. Aqui o
# console fica desligado; em producao ele continua ligado por padrao.
server:
  port: 8081

spring:
  application:
    name: onboarding-agent
  ai:
    openai:
      base-url: http://localhost:8080
      api-key: not-needed
      chat:
        options:
          model: gemma-2-2b-it
          temperature: 0.2

agent:
  console: false
  workspace-path: ${java.io.tmpdir}/agent-workspace-test
  max-replans: 2
  max-retries: 2
  confidence-threshold: 0.5
