# A 8080 fica reservada para o llama-server; o Tomcat sobe na 8081 para nao colidir.
server:
  port: 8081

spring:
  application:
    name: onboarding-agent
  ai:
    openai:
      base-url: http://localhost:8080
      api-key: not-needed
      chat:
        options:
          model: gemma-2-2b-it
          temperature: 0.2

agent:
  ui: console                                    # console | swing | none
  workspace-path: ${user.home}/agent-workspace   # repo Git de teste
  journey-path: ${user.home}/.onboarding-agent-journey.properties
  max-replans: 2
  max-retries: 2
  confidence-threshold: 0.5

# Necessario apenas para abrir pull requests (FASE 7).
# O token pode vir da variavel de ambiente GITHUB_TOKEN.
github:
  api-url: https://api.github.com
  owner: ""
  repo: ""
  token: ${GITHUB_TOKEN:}
